<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../images/favicon-enhanced.png">
  <title>Sukoon - Contact Us</title>
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/contact.css" />
</head>

<body>
  <!-- Floating Navigation -->
  <div class="nav-wrapper">
    <nav class="nav" id="nav">
      <a class="navbar-brand" href="../index.html">
        <img src="../logo.png" alt="Sukoon Logo" class="logo" />
        <span class="brand-text">Sukoon</span>
      </a>

      <div class="nav-links" id="navLinks">
        <ul class="links" id="navmenu">
          <li><a href="../index.html">HOME</a></li>
          <li><a href="../index.html#about">ABOUT</a></li>
          <li><a href="../index.html#services">SERVICES</a></li>
          <li><a href="contact.html" class="active">CONTACT</a></li>
        </ul>
      </div>

      <div class="login-button">
        <a href="login.html" class="nav-cta-btn">Get Support</a>
      </div>
    </nav>
  </div>

  <!-- Contact Container -->
  <div class="contact-container">
    <div class="contact-card">
      <h1 class="contact-title">Get in Touch</h1>
      <p class="contact-subtitle">
        Have questions or feedback? We are here to support your mental health journey.
      </p>

      <form action="https://formspree.io/f/mvoygqdg" method="POST">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" name="name" class="form-control" placeholder="Jane Doe" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="jane@example.com" required />
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" name="subject" class="form-control" placeholder="How can we help you?" required />
        </div>

        <div class="form-group">
          <label for="suggestion">Message or Suggestions</label>
          <textarea name="suggestion" class="form-control" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="../index.html" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">← Back to Home</a>
      </div>
    </div>
  </div>
</body>

</html>
