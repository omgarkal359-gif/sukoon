<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../images/favicon-enhanced.png" />
  <title>Sukoon - Welcome Back</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <!-- Floating Navigation -->
  <div class="nav-wrapper">
    <nav class="nav" id="nav">
      <a class="navbar-brand" href="../index.html">
        <img src="../logo.png" alt="Sukoon Logo" class="logo" />
        <span class="brand-text">Sukoon</span>
      </a>

      <div class="nav-links" id="navLinks">
        <ul class="links" id="navmenu">
          <li><a href="../index.html">HOME</a></li>
          <li><a href="../index.html#services">SERVICES</a></li>
          <li><a href="contact.html">CONTACT</a></li>
        </ul>
      </div>
    </nav>
  </div>

  <div class="login-container">
    <div class="login-card">
      <img src="../logo.png" alt="Sukoon Logo" class="login-brand-logo" />
      <h1 class="login-title">Welcome to Sukoon</h1>
      <p class="login-subtitle">Sign in to access your personal stress-relief tools.</p>

      <form onsubmit="event.preventDefault(); alert('Logged in successfully!');">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" class="form-control" placeholder="Enter your username" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="login-footer-text">
        Don't have an account? <a href="#">Create One</a>
      </div>

      <div style="margin-top: 1.5rem;">
        <a href="../index.html" style="color: var(--color-text-muted); font-size: 0.875rem;">← Back to Home</a>
      </div>
    </div>
  </div>
</body>

</html>
